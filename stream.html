<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Floorball Stream Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: transparent;
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  font-family: 'Barlow Condensed', sans-serif;
}

/* ── Gemeinsame Utility-Klassen ─────────────────────────────────────── */
.hidden { display: none !important; }

.clock-running { color: #ffffff; }
.clock-stopped { color: #aaaaaa; }

/* ══════════════════════════════════════════════════════════════════════
   LAYOUT 1 – Breiter Balken mit Keilen, oben links
   ?layout=1
══════════════════════════════════════════════════════════════════════ */
#layout1 {
  position: absolute;
  top: 40px;
  left: 40px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  filter: drop-shadow(0 4px 32px rgba(0,0,0,0.8));
}

/* Hauptbalken */
#l1-bar {
  display: flex;
  align-items: stretch;
  height: 88px;
  border-radius: 6px;
  overflow: hidden;
  background: #0c0e14;
}

/* Heimblock */
#l1-home {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 130px;
  background: var(--home-color, #c8ff00);
  clip-path: polygon(0 0, 100% 0, 85% 100%, 0 100%);
  padding-right: 18px;
}
#l1-home-abbr {
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 1px;
  color: var(--home-text, #000);
  text-transform: uppercase;
}

/* Score Heim */
#l1-home-score {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 62px;
  color: var(--home-color, #c8ff00);
  padding: 0 20px 0 14px;
  line-height: 1;
  align-self: center;
}

/* Trennlinie */
.l1-divider {
  width: 2px;
  background: rgba(255,255,255,0.1);
  align-self: stretch;
  margin: 14px 0;
}

/* Mitte: Uhr + Drittel */
#l1-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 28px;
  gap: 2px;
  flex: 1;
}
#l1-clock {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 58px;
  color: #ffffff;
  letter-spacing: 3px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
#l1-period {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 3px;
  color: #ff8c00;
  text-transform: uppercase;
}

/* Score Gast */
#l1-away-score {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 62px;
  color: var(--away-color, #22c55e);
  padding: 0 14px 0 20px;
  line-height: 1;
  align-self: center;
}

/* Gastblock */
#l1-away {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 130px;
  background: var(--away-color, #22c55e);
  clip-path: polygon(15% 0, 100% 0, 100% 100%, 0 100%);
  padding-left: 18px;
}
#l1-away-abbr {
  font-size: 28px;
  font-weight: 900;
  letter-spacing: 1px;
  color: var(--away-text, #000);
  text-transform: uppercase;
}

/* Penalty-Zeile L1 */
#l1-penalties {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.l1-pen-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #0c0e14;
  border-radius: 4px;
  padding: 8px 16px;
  height: 44px;
  min-width: 400px;
  border-left: 3px solid #ff3b3b;
}
.l1-pen-dot { width: 10px; height: 10px; border-radius: 50%; background: #ff3b3b; flex-shrink: 0; }
.l1-pen-label { font-size: 12px; font-weight: 700; letter-spacing: 2px; color: #ff3b3b; text-transform: uppercase; }
.l1-pen-team  { font-size: 16px; font-weight: 900; color: #f2f5ff; margin-left: 4px; }
.l1-pen-info  { font-size: 14px; font-weight: 600; color: #8090b0; }
.l1-pen-time  { font-size: 18px; font-weight: 900; color: #ff3b3b; margin-left: auto; font-variant-numeric: tabular-nums; }


/* ══════════════════════════════════════════════════════════════════════
   LAYOUT 2 – Kompakt mit Schrägschnitt, oben links
   ?layout=2
══════════════════════════════════════════════════════════════════════ */
#layout2 {
  position: absolute;
  top: 40px;
  left: 40px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  filter: drop-shadow(0 4px 32px rgba(0,0,0,0.8));
}

#l2-bar {
  display: flex;
  align-items: stretch;
  height: 76px;
}

/* Heimblock mit Score */
#l2-home {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 24px 0 18px;
  background: var(--home-color, #c8ff00);
  clip-path: polygon(0 0, 100% 0, 88% 100%, 0 100%);
  border-radius: 6px 0 0 6px;
  min-width: 150px;
}
#l2-home-abbr {
  font-size: 22px;
  font-weight: 900;
  color: var(--home-text, #000);
  text-transform: uppercase;
  letter-spacing: 1px;
}
#l2-home-score {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 56px;
  color: var(--home-text, #000);
  line-height: 1;
}

/* Mitte */
#l2-center {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #0c0e14;
  padding: 0 22px;
  gap: 1px;
  min-width: 120px;
}
#l2-clock {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 46px;
  color: #ffffff;
  letter-spacing: 2px;
  line-height: 1;
  font-variant-numeric: tabular-nums;
}
#l2-period {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #ff8c00;
  text-transform: uppercase;
}

/* Gastblock */
#l2-away {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 18px 0 24px;
  background: var(--away-color, #22c55e);
  clip-path: polygon(12% 0, 100% 0, 100% 100%, 0 100%);
  border-radius: 0 6px 6px 0;
  min-width: 150px;
}
#l2-away-score {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 56px;
  color: var(--away-text, #000);
  line-height: 1;
}
#l2-away-abbr {
  font-size: 22px;
  font-weight: 900;
  color: var(--away-text, #000);
  text-transform: uppercase;
  letter-spacing: 1px;
}

/* Penalty L2 */
#l2-penalties { display: flex; flex-direction: column; gap: 4px; }
.l2-pen-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #0c0e14;
  border-radius: 4px;
  padding: 8px 16px;
  height: 40px;
  border-left: 3px solid #ff3b3b;
  min-width: 360px;
}
.l2-pen-dot   { width: 9px; height: 9px; border-radius: 50%; background: #ff3b3b; flex-shrink: 0; }
.l2-pen-label { font-size: 11px; font-weight: 700; letter-spacing: 2px; color: #ff3b3b; text-transform: uppercase; }
.l2-pen-team  { font-size: 15px; font-weight: 900; color: #f2f5ff; }
.l2-pen-info  { font-size: 13px; font-weight: 600; color: #8090b0; }
.l2-pen-time  { font-size: 17px; font-weight: 900; color: #ff3b3b; margin-left: auto; font-variant-numeric: tabular-nums; }


/* ══════════════════════════════════════════════════════════════════════
   LAYOUT 3 – Einzelne schlanke Leiste, oben links
   ?layout=3
══════════════════════════════════════════════════════════════════════ */
#layout3 {
  position: absolute;
  top: 40px;
  left: 40px;
  filter: drop-shadow(0 4px 24px rgba(0,0,0,0.8));
}

#l3-bar {
  display: flex;
  align-items: center;
  gap: 0;
  height: 56px;
  background: rgba(12,14,20,0.92);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 8px;
  padding: 0 20px;
  gap: 16px;
  white-space: nowrap;
}

.l3-team-block {
  display: flex;
  align-items: center;
  gap: 8px;
}
.l3-abbr {
  font-size: 18px;
  font-weight: 900;
  color: #f2f5ff;
  text-transform: uppercase;
  letter-spacing: 1px;
  text-decoration: underline 2px;
  text-underline-offset: 4px;
}
.l3-abbr.home { text-decoration-color: var(--home-color, #c8ff00); }
.l3-abbr.away { text-decoration-color: var(--away-color, #22c55e); }

.l3-score {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 36px;
  line-height: 1;
}
.l3-score.home { color: var(--home-color, #c8ff00); }
.l3-score.away { color: var(--away-color, #22c55e); }

.l3-divider {
  width: 1px;
  height: 28px;
  background: rgba(255,255,255,0.15);
}

#l3-clock {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 34px;
  color: #ffffff;
  letter-spacing: 2px;
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
#l3-period {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 2px;
  color: #ff8c00;
  text-transform: uppercase;
}

/* Penalty in L3: kompakt in der gleichen Leiste nach rechts */
#l3-pen-block {
  display: flex;
  align-items: center;
  gap: 6px;
}
.l3-pen-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff3b3b; flex-shrink: 0; }
.l3-pen-num { font-size: 16px; font-weight: 700; color: #f2f5ff; }
.l3-pen-time { font-size: 16px; font-weight: 700; color: #ff3b3b; font-variant-numeric: tabular-nums; }

</style>
</head>
<body>

<!-- ── LAYOUT 1 ─────────────────────────────────────────────────────── -->
<div id="layout1" class="hidden">
  <div id="l1-bar">
    <div id="l1-home"><span id="l1-home-abbr">SHA</span></div>
    <div id="l1-home-score">3</div>
    <div class="l1-divider"></div>
    <div id="l1-center">
      <div id="l1-clock">6:52</div>
      <div id="l1-period">2. Drittel</div>
    </div>
    <div class="l1-divider"></div>
    <div id="l1-away-score">2</div>
    <div id="l1-away"><span id="l1-away-abbr">WOL</span></div>
  </div>
  <div id="l1-penalties"></div>
</div>

<!-- ── LAYOUT 2 ─────────────────────────────────────────────────────── -->
<div id="layout2" class="hidden">
  <div id="l2-bar">
    <div id="l2-home">
      <span id="l2-home-abbr">SHA</span>
      <span id="l2-home-score">3</span>
    </div>
    <div id="l2-center">
      <div id="l2-clock">5:43</div>
      <div id="l2-period">P 2</div>
    </div>
    <div id="l2-away">
      <span id="l2-away-score">2</span>
      <span id="l2-away-abbr">WOL</span>
    </div>
  </div>
  <div id="l2-penalties"></div>
</div>

<!-- ── LAYOUT 3 ─────────────────────────────────────────────────────── -->
<div id="layout3" class="hidden">
  <div id="l3-bar">
    <div class="l3-team-block">
      <span class="l3-abbr home" id="l3-home-abbr">SHA</span>
      <span class="l3-score home" id="l3-home-score">3</span>
    </div>
    <div class="l3-divider"></div>
    <div id="l3-clock">5:30</div>
    <div id="l3-period">P2</div>
    <div class="l3-divider"></div>
    <div class="l3-team-block">
      <span class="l3-abbr away" id="l3-away-abbr">WOL</span>
      <span class="l3-score away" id="l3-away-score">2</span>
    </div>
    <div class="l3-divider" id="l3-pen-divider" style="display:none"></div>
    <div id="l3-pen-block"></div>
  </div>
</div>

<script>
// ── Layout-Erkennung ───────────────────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const layout = params.get('layout') || '1';
document.getElementById('layout' + layout).classList.remove('hidden');

// ── Uhr-State ──────────────────────────────────────────────────────────────────
let state = null;
let clockMs = null;
let clockRunning = false;
let lastTickAt = null;
let localClockTimer = null;
let countUp = false;
let periodSecs = 1200;

function startLocalClock() {
  if (localClockTimer) return;
  lastTickAt = performance.now();
  localClockTimer = setInterval(() => {
    if (!clockRunning || clockMs === null) return;
    const now = performance.now();
    clockMs = Math.max(0, clockMs - (now - lastTickAt));
    lastTickAt = now;
    renderClock();
  }, 100);
}

function stopLocalClock() {
  clearInterval(localClockTimer);
  localClockTimer = null;
}

function clockString() {
  const totalSecs = Math.ceil(clockMs / 1000);
  const disp = countUp ? Math.max(0, periodSecs - totalSecs) : Math.max(0, totalSecs);
  const m = Math.floor(disp / 60);
  const s = disp % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

function renderClock() {
  const t = clockString();
  setText('l1-clock', t);
  setText('l2-clock', t);
  setText('l3-clock', t);
}

// ── Perioden-Label ─────────────────────────────────────────────────────────────
function periodLabel(s, short) {
  const pn3 = short
    ? ['P 1','P 2','P 3','VL']
    : ['1. DRITTEL','2. DRITTEL','3. DRITTEL','VERLÄNGERUNG'];
  const pn2 = short
    ? ['H 1','H 2','VL']
    : ['1. HALBZEIT','2. HALBZEIT','VERLÄNGERUNG'];
  const arr = s.maxPeriods === 3 ? pn3 : pn2;
  return arr[(s.period || 1) - 1] || 'ENDE';
}

// ── State anwenden ─────────────────────────────────────────────────────────────
function applyState(s) {
  if (!s || !Object.keys(s).length) return;

  const newRunning = !!s.running;
  countUp   = !!s.sbCountUp;
  periodSecs = s.periodSecs || 1200;

  // Uhr synchronisieren
  if (!state || clockRunning !== newRunning || !clockRunning) {
    let ms = s._clockMs != null ? s._clockMs : s.clock * 1000;
    if (newRunning && s._sentAt) ms = Math.max(0, ms - (Date.now() - s._sentAt));
    clockMs = ms;
  }
  clockRunning = newRunning;

  if (clockRunning) {
    lastTickAt = performance.now();
    startLocalClock();
  } else {
    clockMs = s._clockMs != null ? s._clockMs : s.clock * 1000;
    stopLocalClock();
    renderClock();
  }

  state = s;
  renderUI(s);
}

// ── Farben setzen ──────────────────────────────────────────────────────────────
function contrastColor(hex) {
  if (!hex || hex.length < 7) return '#000000';
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.55 ? '#000000' : '#ffffff';
}

// ── UI rendern ─────────────────────────────────────────────────────────────────
function setText(id, val) {
  const el = document.getElementById(id);
  if (el) el.textContent = val;
}

function renderUI(s) {
  const root = document.documentElement;
  const hc = s.homeAccent || '#c8ff00';
  const ac = s.awayAccent || '#22c55e';
  root.style.setProperty('--home-color', hc);
  root.style.setProperty('--away-color', ac);
  root.style.setProperty('--home-text', contrastColor(hc));
  root.style.setProperty('--away-text', contrastColor(ac));

  // Abkürzungen (ersten 3 Buchstaben des Namens)
  const homeAbbr = (s.homeName || 'HEI').slice(0,3).toUpperCase();
  const awayAbbr = (s.awayName || 'GAS').slice(0,3).toUpperCase();

  // Layout 1
  setText('l1-home-abbr',   homeAbbr);
  setText('l1-away-abbr',   awayAbbr);
  setText('l1-home-score',  s.homeScore ?? 0);
  setText('l1-away-score',  s.awayScore ?? 0);
  setText('l1-period',      periodLabel(s, false));

  // Layout 2
  setText('l2-home-abbr',   homeAbbr);
  setText('l2-away-abbr',   awayAbbr);
  setText('l2-home-score',  s.homeScore ?? 0);
  setText('l2-away-score',  s.awayScore ?? 0);
  setText('l2-period',      periodLabel(s, true));

  // Layout 3
  setText('l3-home-abbr',   homeAbbr);
  setText('l3-away-abbr',   awayAbbr);
  setText('l3-home-score',  s.homeScore ?? 0);
  setText('l3-away-score',  s.awayScore ?? 0);
  setText('l3-period',      periodLabel(s, true));

  renderClock();
  renderPenalties(s, homeAbbr, awayAbbr, hc, ac);
}

// ── Penalties rendern ──────────────────────────────────────────────────────────
function renderPenalties(s, homeAbbr, awayAbbr, hc, ac) {
  const fmt = t => {
    const m = Math.floor(t/60), sc = t%60;
    return `${m}:${String(sc).padStart(2,'0')}`;
  };

  // Alle aktiven Strafen sammeln (max 2 pro Team, kürzeste zuerst)
  const collect = (side, abbr, color) =>
    (s[side+'Penalties'] || [])
      .filter(p => !p.waiting && !p.personal)
      .sort((a,b) => a.remaining - b.remaining)
      .slice(0, 2)
      .map(p => ({ abbr, color, number: p.number, remaining: p.remaining,
                   type: p.secs <= 120 ? '2 MIN' : '10 MIN' }));

  const pens = [
    ...collect('home', homeAbbr, hc),
    ...collect('away', awayAbbr, ac),
  ];

  // Layout 1 & 2: Penalty-Zeile
  ['l1','l2'].forEach(pre => {
    const container = document.getElementById(pre+'-penalties');
    if (!container) return;
    container.innerHTML = pens.map(p => `
      <div class="${pre}-pen-row">
        <div class="${pre}-pen-dot" style="background:${p.color}"></div>
        <span class="${pre}-pen-label">STRAFE</span>
        <span class="${pre}-pen-team">${p.abbr}</span>
        <span class="${pre}-pen-info">&nbsp;#${p.number} · ${p.type}</span>
        <span class="${pre}-pen-time">${fmt(p.remaining)}</span>
      </div>`).join('');
  });

  // Layout 3: kompakter Block in der Leiste (nur erste Strafe)
  const penBlock  = document.getElementById('l3-pen-block');
  const penDivider = document.getElementById('l3-pen-divider');
  if (penBlock) {
    if (pens.length > 0) {
      const p = pens[0];
      penBlock.innerHTML = `
        <div class="l3-pen-dot" style="background:${p.color}"></div>
        <span class="l3-pen-num">#${p.number}</span>
        <span class="l3-pen-time">${fmt(p.remaining)}</span>`;
      penDivider.style.display = '';
    } else {
      penBlock.innerHTML = '';
      penDivider.style.display = 'none';
    }
  }
}

// ── Polling ────────────────────────────────────────────────────────────────────
async function poll() {
  try {
    const res = await fetch('/api/state');
    if (res.ok) {
      const data = await res.json();
      if (data && Object.keys(data).length) applyState(data);
    }
  } catch(e) {}
}

poll();
setInterval(poll, 500);
</script>
</body>
</html>
